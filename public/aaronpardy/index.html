<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Aaronpardy</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Bowlby+One+SC&family=Libre+Caslon+Text:wght@400;700&display=swap">
<style id="css">
/* Layout: a TV game-show stage. One blue board, a scoreboard rail under it; chaos arrives as tilted pink stickers stamped over the clue. Single dark look on purpose. */
:root{
  --stage:#060a26; --stage-2:#0c1342; --board:#1424b4; --board-hi:#1f36d8; --board-lo:#0a1476;
  --line:#2c379a; --ink:#f5f3ff; --muted:#aab2e8; --shadow:#02041a;
  --gold:#ffcf3f; --gold-ink:#1d1500;
  --chaos:#ff3e86; --chaos-ink:#fff4ad;
  --good:#3fe08f; --good-ink:#04281a; --bad:#ff6767; --bad-ink:#2d0505;
  --f-value:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --f-clue:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  --f-loud:"Bowlby One SC","Arial Black",Impact,sans-serif;
  --f-ui:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--stage);background-image:radial-gradient(120% 60% at 50% -12%,var(--stage-2),var(--stage) 62%);background-attachment:fixed;color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--stage)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
.narrow{max-width:760px}

/* type */
.logo{font-family:var(--f-loud);font-weight:400;margin:0;line-height:.86;font-size:clamp(52px,13vw,128px);color:var(--gold);letter-spacing:-.01em;text-shadow:3px 3px 0 var(--board),6px 6px 0 var(--shadow);text-wrap:balance}
.logo span{color:var(--ink)}
.logo.small{font-size:clamp(36px,7vw,64px)}
.eyebrow,.kicker{margin:0;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--chaos)}
.tag{margin:0;font-size:clamp(17px,2.2vw,21px);color:var(--muted);max-width:52ch}
h2{margin:0;font-family:var(--f-value);font-weight:400;font-size:24px;letter-spacing:.03em;text-transform:uppercase}
p{margin:0}
.muted{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:6px;border:2px solid var(--line);background:var(--stage-2);color:var(--ink);font-weight:600;cursor:pointer;text-align:center;line-height:1.15}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn.chaos{background:var(--chaos);border-color:var(--chaos);color:var(--chaos-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn.big{font-size:19px;padding:14px 26px;min-height:54px}
.btn.mini{min-height:36px;padding:6px 10px;font-size:14px}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--bad-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* panels */
.panel{background:var(--stage-2);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.marquee{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.how ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:68ch}
.notice{border-radius:8px;padding:12px 14px;font-weight:600}
.notice.warn{background:transparent;border:1.5px solid var(--chaos);color:var(--chaos-ink)}
.notice.ok{background:transparent;border:1.5px solid var(--good);color:var(--good)}

/* form controls */
label,.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],textarea,select{font:16px var(--f-ui);background:var(--stage);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px;line-height:1.4}
input:focus,textarea:focus,select:focus{border-color:var(--gold);outline:none}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.player-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.x{min-width:44px;padding:0}

/* laws */
.laws{margin:0;padding:0;list-style:none;counter-reset:law;display:flex;flex-direction:column;gap:14px}
.laws li{counter-increment:law;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:baseline}
.laws li::before{content:"LAW " counter(law);font-family:var(--f-value);color:var(--gold);font-size:18px;letter-spacing:.04em;white-space:nowrap}
.laws strong{display:block;font-size:19px}
.powers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.power-card{border:2px dashed var(--chaos);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.power-card .who{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.power-card .pn{font-family:var(--f-loud);color:var(--chaos);font-size:20px;line-height:1.05}

/* board */
.topbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.topbar .mid{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.picking{font-size:17px}
.picking strong{color:var(--gold)}
.slipcount{font-size:14px;color:var(--muted)}
.slipcount b{color:var(--chaos);font-variant-numeric:tabular-nums}
.tb-right{display:flex;flex-wrap:wrap;gap:6px}
.board-wrap{overflow-x:auto}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(3px,.6vw,8px);background:var(--shadow);padding:clamp(4px,.8vw,10px);border-radius:8px;box-shadow:0 18px 50px var(--shadow);min-width:300px}
.cat{background:var(--board);display:grid;place-items:center;text-align:center;padding:8px 4px;min-height:clamp(50px,9vw,96px);font-family:var(--f-value);text-transform:uppercase;font-size:clamp(11px,1.9vw,22px);line-height:1.05;letter-spacing:.02em;text-wrap:balance;text-shadow:2px 2px 0 var(--shadow);border-bottom:3px solid var(--shadow)}
.tile{background:var(--board);border:0;aspect-ratio:16/10;display:grid;place-items:center;font-family:var(--f-value);color:var(--gold);font-size:clamp(20px,5vw,58px);text-shadow:2px 2px 0 var(--shadow),3px 3px 0 var(--shadow);cursor:pointer;padding:0;transition:background .12s}
.tile:hover{background:var(--board-hi)}
.tile.used,.tile.empty{background:var(--board-lo);color:var(--line);cursor:default;text-shadow:none}
.tile.empty{font-size:clamp(14px,2vw,20px)}

.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.pc{background:var(--board-lo);border:2px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pc.picking-now{border-color:var(--gold)}
.pc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pc-name{background:none;border:0;padding:0;font-weight:700;font-size:18px;cursor:pointer;text-align:left;min-width:0;overflow-wrap:anywhere}
.pc.picking-now .pc-name{color:var(--gold)}
.role{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:right}
.pc-score{font-family:var(--f-value);font-size:clamp(30px,4vw,42px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.pc-score.neg{color:var(--bad)}
.pc-row{display:flex;flex-wrap:wrap;gap:6px}
.pc-row .btn{flex:1 1 auto}
.power-chip{border-style:dashed;border-color:var(--chaos);color:var(--chaos-ink)}
.power-chip.used{text-decoration:line-through;opacity:.5;border-color:var(--line)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:var(--board);background-image:radial-gradient(90% 70% at 50% 40%,var(--board-hi),var(--board) 70%);display:flex;overflow-y:auto;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay.wheel-ov{z-index:60;background:var(--stage);background-image:none}
.overlay.msg-ov{z-index:70;background:var(--stage);background-image:radial-gradient(80% 60% at 50% 30%,var(--stage-2),var(--stage))}
.ov-inner{margin:auto;width:100%;max-width:980px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px}
.ov-meta{font-family:var(--f-value);font-size:clamp(16px,2.4vw,24px);letter-spacing:.06em;text-transform:uppercase;color:var(--chaos-ink)}
.ov-meta .x2{color:var(--chaos);margin-left:8px}
.clue-text{font-family:var(--f-clue);font-weight:700;text-transform:uppercase;font-size:clamp(24px,4.6vw,54px);line-height:1.22;text-shadow:3px 3px 0 var(--shadow);max-width:28ch;text-wrap:balance;overflow-wrap:anywhere}
.clue-small{font-family:var(--f-clue);font-weight:700;text-transform:uppercase;font-size:clamp(15px,1.8vw,19px);color:var(--muted);max-width:60ch;text-wrap:balance}
.hint{font-size:17px;color:var(--chaos-ink)}
.ans-label{font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.answer{font-family:var(--f-clue);font-weight:700;color:var(--gold);font-size:clamp(24px,4vw,46px);line-height:1.2;text-shadow:3px 3px 0 var(--shadow);max-width:30ch;text-wrap:balance;overflow-wrap:anywhere}
.answer.blank{color:var(--muted);font-style:italic;font-size:20px;text-shadow:none;font-weight:400}
.clue-text.mc{font-size:clamp(22px,3.6vw,42px);max-width:32ch}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:900px;text-align:left}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--board-lo);border:2px solid var(--shadow);border-radius:10px;padding:12px 16px;min-width:0;transition:opacity .25s}
.opt .l{font-family:var(--f-value);font-size:clamp(26px,3.4vw,38px);color:var(--gold);line-height:1;text-shadow:2px 2px 0 var(--shadow);min-width:1ch;text-align:center}
.opt .t{font-size:clamp(17px,2.1vw,23px);font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.opt.correct{background:var(--gold);border-color:var(--ink);color:var(--gold-ink);box-shadow:6px 6px 0 var(--shadow)}
.opt.correct .l{color:var(--gold-ink);text-shadow:none}
.opts.revealed .opt:not(.correct){opacity:.35}
.ans-letter{font-family:var(--f-value);font-weight:400;color:var(--gold);font-size:1.7em;letter-spacing:0;margin-left:6px;vertical-align:-.15em}
.why{font-family:var(--f-clue);font-style:italic;font-size:clamp(19px,2.4vw,26px);line-height:1.45;max-width:44ch}
.why::before{content:"\201C"}
.why::after{content:"\201D"}
.board.tall .tile{aspect-ratio:2/1}
.vid{width:100%;max-width:560px;max-height:52vh;border-radius:10px;background:var(--shadow);border:3px solid var(--gold)}
.vid-missing{font-size:14px;color:var(--muted)}
.score-box{display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--board-lo);border:2px solid var(--shadow);border-radius:12px;padding:16px;width:100%;max-width:720px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:2px solid var(--line);background:var(--stage);color:var(--ink);border-radius:999px;padding:10px 16px;font-weight:700;font-size:17px;cursor:pointer;min-height:44px}
.chip .pts{font-family:var(--f-value);font-weight:400;margin-left:8px;color:var(--gold);letter-spacing:.02em}
.chip.right{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.chip.right .pts{color:var(--good-ink)}
.chip.wrong{background:var(--bad);border-color:var(--bad);color:var(--bad-ink)}
.chip.wrong .pts{color:var(--bad-ink)}
.chip.pick{background:var(--chaos);border-color:var(--chaos);color:var(--chaos-ink)}
.wager-row{display:flex;gap:10px;align-items:end;justify-content:center;flex-wrap:wrap}
.wager-row .field{width:180px}
.wager-row input{font-family:var(--f-value);font-size:28px;text-align:center}

/* chaos sticker */
.sticker{background:var(--chaos);color:var(--chaos-ink);font-family:var(--f-loud);font-size:clamp(34px,7.5vw,78px);line-height:.95;padding:18px 28px 22px;border:5px solid var(--chaos-ink);box-shadow:8px 8px 0 var(--shadow);transform:rotate(-3deg);max-width:100%;overflow-wrap:anywhere;animation:stamp .5s cubic-bezier(.2,1.5,.4,1) both}
.sticker.dd{background:var(--gold);color:var(--gold-ink);border-color:var(--ink);transform:rotate(2deg);animation-name:stamp2}
@keyframes stamp{0%{transform:scale(2.4) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-3deg);opacity:1}}
@keyframes stamp2{0%{transform:scale(2.4) rotate(12deg);opacity:0}100%{transform:scale(1) rotate(2deg);opacity:1}}
.sticker.spy{background:var(--shadow);color:var(--chaos);border-color:var(--chaos);transform:rotate(-2deg)}
.chaos-rule{font-size:clamp(18px,2.5vw,25px);line-height:1.4;max-width:40ch;font-weight:500}
.wish-list{display:flex;flex-direction:column;gap:6px;max-width:44ch;text-align:left;font-size:17px}
.check-row{display:flex;gap:12px;align-items:flex-start;font-size:16px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink);cursor:pointer;padding-top:6px;border-top:1px solid var(--line)}
.check-row input{width:22px;height:22px;flex:none;margin:2px 0 0;accent-color:var(--gold)}
.done-note{font-weight:700;color:var(--good)}

/* wheel */
.wheel-box{position:relative;width:min(84vw,420px);aspect-ratio:1;max-width:100%}
.wheel-box canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--ink);filter:drop-shadow(2px 3px 0 var(--shadow))}
.wheel-result{font-family:var(--f-loud);font-size:clamp(26px,5vw,44px);color:var(--chaos);line-height:1}

/* final */
.final{background:var(--board);background-image:radial-gradient(90% 80% at 50% 30%,var(--board-hi),var(--board) 70%);border-radius:14px;padding:clamp(18px,4vw,40px) clamp(16px,3vw,32px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;box-shadow:0 18px 50px var(--shadow)}
.final-cat{font-family:var(--f-value);font-size:clamp(24px,4vw,40px);text-transform:uppercase;letter-spacing:.04em}
.final-cat span{color:var(--gold)}
.wagers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;width:100%;max-width:760px}
.timer{width:100%;max-width:560px;height:10px;background:var(--board-lo);border-radius:999px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);transform-origin:left;animation:drain 30s linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.fres{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;width:100%;max-width:760px}
.fres .pc{text-align:left}

/* winner */
.winner{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:18px}
.winner .wname{font-family:var(--f-loud);font-size:clamp(46px,11vw,110px);line-height:.9;color:var(--gold);text-shadow:4px 4px 0 var(--board),8px 8px 0 var(--shadow);overflow-wrap:anywhere}
.standings{width:100%;max-width:560px;border-collapse:collapse;font-size:18px}
.standings td{padding:10px 8px;border-bottom:1px solid var(--line)}
.standings td:last-child{text-align:right;font-family:var(--f-value);font-size:24px;font-variant-numeric:tabular-nums}
.standings td.neg{color:var(--bad)}
.prize{border:2px dashed var(--gold);border-radius:10px;padding:14px 18px;max-width:560px;width:100%}
.msg-text{font-family:var(--f-clue);font-size:clamp(19px,2.6vw,26px);line-height:1.55;white-space:pre-wrap;max-width:44ch;text-align:left}

/* setup */
.savebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--stage);border-bottom:1px solid var(--line);padding-block:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.savebar .status{font-size:14px;color:var(--muted)}
.savebar .status b{color:var(--chaos-ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.cat-block{gap:4px}
.clue-edit{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px 14px;padding-block:14px;border-top:1px solid var(--line)}
.clue-edit .val{font-family:var(--f-value);font-size:26px;color:var(--gold);line-height:1;padding-top:6px}
.val-box{display:flex;flex-direction:column;gap:5px;min-width:0}
select.worth{font-family:var(--f-value);font-size:24px;letter-spacing:.02em;color:var(--gold);padding:6px 8px;cursor:pointer}
.values-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.values-row input{font-family:var(--f-value);font-size:20px;color:var(--gold);text-align:center;padding:8px 4px}
.prize-text{white-space:pre-wrap}
.count{font-size:13px;color:var(--muted);text-align:right}
.clue-edit.no-val{grid-template-columns:minmax(0,1fr)}
.type-toggle{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;align-items:center;gap:8px;min-height:36px;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.seg input{margin:0;accent-color:var(--gold)}
.seg:has(input:checked){border-color:var(--gold);color:var(--ink)}
.opt-set{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.opt-set legend{padding:0;margin-bottom:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.opt-edit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.opt-edit input[type=radio]{width:22px;height:22px;margin:12px 0 0;accent-color:var(--gold);cursor:pointer}
.opt-edit textarea{min-height:46px}
.edit-actions{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.bm-select{width:auto;flex:1 1 220px}
.add-row{padding-top:12px;border-top:1px solid var(--line)}
.link.danger{color:var(--bad)}
.small{font-size:14px}
.badge.from{border:1.5px solid var(--line);color:var(--muted)}
.clue-fields{display:flex;flex-direction:column;gap:10px;min-width:0}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px}
.badge.check{background:var(--gold);color:var(--gold-ink)}
.badge.blank{border:1.5px solid var(--chaos);color:var(--chaos-ink)}
.vrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.vrow video{width:180px;max-width:100%;border-radius:6px;background:var(--shadow)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

  swap: { name: 'Score Swap', rule: 'Before the clue, {picker} may swap scores with any player. Choose wisely. Or cruelly.' },
  impression: { name: 'In Character', rule: 'Everyone says their answer out loud in their best impression of the groom. {bride} picks the best one for 100 extra points. She may pick herself.' },
  mom: { name: 'Mother Knows Best', rule: '{mom} answers out loud first. If she’s right, she gets double. If she’s wrong, everyone else gets a shot at normal points.', needs: 'mom' },
  tax: { name: 'Bridal Tax', rule: 'Everyone except {bride} pays 100 points to {bride}. Then play the clue normally.', needs: 'bride' },
  steal: { name: 'Highway Robbery', rule: 'This clue pays out of the leader’s score instead of the bank. Every right answer takes its points straight from {leader}.' },
  lightning: { name: 'Lightning Round', rule: 'No napkins. Slap the table, then answer out loud. Right answers get double. Wrong answers lose the clue value.' },
  hotseat: { name: 'Hot Seat', rule: 'Only last place answers: {last}. It’s worth triple. The audience may not help. The audience will help anyway.' },
  wheel: { name: 'Wheel of Fate', rule: '{picker} spins the wheel before the clue. The wheel is never wrong.' },
  phone: { name: 'Phone a Groom', rule: 'Call the groom on speaker. He gets 20 seconds to hint at his own answer without saying it. If he doesn’t pick up, {picker} gets the points for emotional damages.' },
  decides: { name: 'The Bride Decides', rule: '{bride} picks who answers this one. If she picks herself, it’s worth half. Power has a price.', needs: 'bride' },
  random: { name: 'Mystery Points', rule: 'Nobody knows what this clue is worth. Not even the board. The value shows up after the answer, and it might be negative. Getting it right could cost you.' },
  genie: { name: 'You Found a Genie', rule: '{picker} gets one wish. Every wish has a catch.' },
  wrong: { name: 'Wrong Answers Only', rule: 'Before the real answer, everyone says the dumbest wrong answer they can think of. {bride} picks her favorite for 200 points. Then play the clue normally.' },
  goose: { name: 'Goose Curse', rule: '{picker} turns one player into a goose. Until the goose’s next pick, they can only honk. Answers must be honked or acted out. Every real word costs 50.' }
};
const BONUS = { impression: { label: 'Best impression', pts: 100 }, wrong: { label: 'Dumbest wrong answer', pts: 200 } };
const MYSTERY = [-300, -100, 50, 69, 111, 250, 404, 500, 777, 1000];
const WISHES = {
  rich: { name: 'Riches', text: 'You get 400. The bride gets 400 too. The genie works for her.' },
  revenge: { name: 'Revenge', text: 'Pick someone to lose 300. You lose 100 for being petty.' },
  fair: { name: 'Fairness', text: 'Everyone’s score becomes the average. Communism.' }
};
const SPY_MISSIONS = [
  'Say the word “penguin” out loud five times tonight without anyone catching on.',
  'Get someone else to say the groom’s real name twice.',
  'Get the bride to do an impression of the groom.',
  'Convince someone to change an answer after they’ve written it down.',
  'Compliment the same person’s hair three separate times.',
  'Get someone to pass you something from across the table three times.'
];
const sgn = n => (n < 0 ? '−' : '+') + fmt(Math.abs(n));
const WHEEL = [
  { label: '+300', text: '{spinner} gets 300 points. The wheel likes you.', fx: (g, s) => ({ [s]: 300 }) },
  { label: 'LEADER −200', text: 'The leader, {leader}, loses 200 points. Heavy is the head.', fx: (g, s, l) => ({ [l]: -200 }) },
  { label: 'ALL +100', text: 'Group hug. Everyone gets 100 points.', fx: g => Object.fromEntries(g.players.map((_, i) => [i, 100])) },
  { label: 'BANKRUPT ½', text: '{spinner} loses half their points. At zero or below, nothing happens and everyone laughs.', fx: (g, s) => ({ [s]: g.players[s].score > 0 ? -Math.floor(g.players[s].score / 2) : 0 }) },
  { label: 'BRIDE +200', text: '{bride} gets 200 points. Just because.', fx: (g, s) => { const b = g.players.findIndex(p => p.role === 'bride'); return { [b >= 0 ? b : s]: 200 }; } },
  { label: 'TOAST', text: '{spinner} gives a 30-second toast to the couple. If the bride approves, 200 points.', manual: 200 },
  { label: 'PIRATE', text: '{spinner} talks like a pirate until their next turn. Every slip costs 50. The host keeps count.' },
  { label: 'SWAP', text: '{spinner} may swap scores with any player.', swap: true }
];

/* ---------- state ---------- */
const app = document.getElementById('app');
let G = ls.get(GKEY);
if (G && (!Array.isArray(G.players) || !G.players.length || G.v !== 1 || G.rev !== DATA.rev)) G = null;
let openSlots = new Set();
let roster = ls.get(RKEY) || defaultRoster();
let spyOn = false;
function phaseView() {
  if (!G) return 'lobby';
  if (G.phase === 'board') return G.deal != null ? 'spy-deal' : 'board';
  if (G.phase === 'spyvote') return 'spy-vote';
  if (G.phase === 'final') return 'final';
  if (G.phase === 'done') return 'winner';
  return 'lobby';
}
let view = (G && G.phase !== 'done') ? phaseView() : 'lobby';
let lawsBack = 'lobby';
let msgOpen = false;
let draft = null;
let dirty = false;
let armed = null;
let copyText = null;
const cap = { artifact: null, assets: null, downloads: null, readOnly: false, checked: false };

function defaultRoster() { return [{ name: DATA.bride || 'Savea', role: 'bride' }, { name: 'Mom', role: 'mom' }, { name: 'Sister', role: 'sister' }]; }
function save() { if (G) ls.set(GKEY, G); }
function name(i) { return (G && G.players[i]) ? G.players[i].name : 'Someone'; }
function roleIdx(role) { return G ? G.players.findIndex(p => p.role === role) : -1; }
function leaderIdx() { let b = 0; G.players.forEach((p, i) => { if (p.score > G.players[b].score) b = i; }); return b; }
function lastIdxs() { const m = Math.min(...G.players.map(p => p.score)); return G.players.map((p, i) => p.score === m ? i : -1).filter(i => i >= 0); }
function listNames(ix) { const n = ix.map(name); return n.length < 2 ? (n[0] || '') : n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1]; }
function tileKeys() { const k = []; DATA.categories.forEach((c, ci) => c.clues.forEach((cl, ri) => { if (cl.q.trim()) k.push(ci + '-' + ri); })); return k; }
function clueAt(key) { const [c, r] = key.split('-').map(Number); return { c, r, cat: DATA.categories[c], clue: DATA.categories[c].clues[r], value: VALUES[r] }; }
function boardDone() { return tileKeys().every(k => G.used[k]); }
function fill(t, extra) {
  const o = G && G.open;
  const map = Object.assign({
    picker: G ? name(G.picker) : '', bride: (G && roleIdx('bride') >= 0) ? name(roleIdx('bride')) : DATA.bride,
    mom: (G && roleIdx('mom') >= 0) ? name(roleIdx('mom')) : 'Mom', groom: DATA.groom,
    leader: o && o.leader != null ? name(o.leader) : (G ? name(leaderIdx()) : ''),
    last: o && o.last ? listNames(o.last) : '', max: o ? fmt(o.max || 0) : ''
  }, extra || {});
  return esc(t).replace(/\{(\w+)\}/g, (m, k) => map[k] != null ? '<strong>' + esc(map[k]) + '</strong>' : m);
}

/* ---------- capabilities ---------- */
function initCaps() {
  if (cap.checked) return;
  if (!(window.claude && typeof window.claude.use === 'function')) return;
  cap.checked = true;
  const set = (k, v) => { cap[k] = v; if (view === 'setup') render(); };
  window.claude.use('artifact').then(a => set('artifact', a)).catch(() => {});
  window.claude.use('assets').then(a => set('assets', a)).catch(() => {});
  window.claude.use('downloads').then(a => set('downloads', a)).catch(() => {});
}
initCaps();
if (!cap.checked) { window.addEventListener('load', initCaps); setTimeout(initCaps, 1500); }

/* rescue a save that lost a race (the page reloaded before we kept the edits) */
(() => {
  const r = ss.get(RESCUE);
  if (!r) return;
  ss.del(RESCUE);
  if (r.rev !== DATA.rev && r.data) { ls.set(DKEY, { base: DATA.rev, data: r.data }); setTimeout(() => toast('Your setup edits were kept as a draft. Open Groom setup to save them again.'), 600); }
  else if (r.rev === DATA.rev) { ls.del(DKEY); setTimeout(() => toast('Saved. The game is updated.'), 400); }
})();

/* ---------- toast ---------- */
let toastEl = null, toastT = null;
function toast(msg) {
  if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role', 'status'); toastEl.setAttribute('aria-live', 'polite'); document.body.appendChild(toastEl); }
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { toastEl.hidden = true; }, 3800);
}

/* ---------- game flow ---------- */
function newGame() {
  const players = roster.filter(p => p.name.trim()).map(p => ({ name: p.name.trim().slice(0, 30), role: ROLES[p.role] ? p.role : 'guest', score: 0, power: false }));
  if (players.length < 2) { toast('Add at least two contestants.'); return false; }
  const keys = shuffle(tileKeys());
  const chaos = {};
  const ddPool = keys.filter(k => +k.split('-')[1] >= 2);
  const dds = (ddPool.length >= 2 ? ddPool : keys).slice(0, 2);
  dds.forEach(k => { chaos[k] = 'dd'; });
  const roles = new Set(players.map(p => p.role));
  const pool = shuffle(Object.keys(CHAOS).filter(k => k !== 'dd' && (!CHAOS[k].needs || roles.has(CHAOS[k].needs))));
  const rest = keys.filter(k => !chaos[k]);
  rest.slice(0, Math.min(5, pool.length)).forEach((k, i) => { chaos[k] = pool[i]; });
  const b = players.findIndex(p => p.role === 'bride');
  G = { v: 1, rev: DATA.rev, players, used: {}, chaos, picker: b >= 0 ? b : 0, slips: 0, open: null, wheel: null, final: null, undo: null, phase: 'board', spy: null, deal: null, dealShow: false, tiePick: null };
  if (spyOn && players.length >= 3) {
    G.spy = { idx: Math.floor(Math.random() * players.length), mission: SPY_MISSIONS[Math.floor(Math.random() * SPY_MISSIONS.length)], step: 'accuse', accused: null, mission_done: null, resolved: false };
    G.deal = 0;
  }
  save();
  return true;
}
function startSpyVote() { G.phase = 'spyvote'; G.open = null; G.wheel = null; save(); view = 'spy-vote'; render(); window.scrollTo(0, 0); }

function openTile(key) {
  if (!G || G.used[key] || G.open) return;
  const ck = G.chaos[key] || null;
  const { value, clue } = clueAt(key);
  G.open = {
    /* multiple-choice answers get a fresh random order every time the tile opens */
    order: clue.mc ? shuffle(clue.opts.map((t, k) => t.trim() ? k : -1).filter(k => k >= 0)) : null,
    key, stage: ck ? 'chaos' : 'clue', chaos: ck, marks: {}, bonus: null, done: {},
    picker: G.picker, leader: leaderIdx(), last: lastIdxs(),
    max: Math.max(G.players[G.picker].score, 400), wager: value,
    rand: ck === 'random' ? MYSTERY[Math.floor(Math.random() * MYSTERY.length)] : null,
    atOpen: G.players.map(p => p.score)
  };
  save(); render(); focusOverlay();
}
function multFor(o, i) {
  const p = G.players[i];
  if (o.chaos === 'lightning') return 2;
  if (o.chaos === 'hotseat') return 3;
  if (o.chaos === 'mom') return p.role === 'mom' ? 2 : 1;
  if (o.chaos === 'decides') return p.role === 'bride' ? 0.5 : 1;
  return 1;
}
function eligible(o) {
  if (o.chaos === 'hotseat') return o.last;
  return G.players.map((_, i) => i);
}
function pointsFor(o, i) { return o.chaos === 'random' ? o.rand : Math.round(clueAt(o.key).value * multFor(o, i)); }

function finishClue(deltas) {
  const o = G.open;
  deltas.forEach((d, i) => { G.players[i].score += d; });
  G.used[o.key] = true;
  const net = G.players.map((p, i) => p.score - o.atOpen[i]);
  G.undo = { key: o.key, net, picker: o.picker };
  G.picker = (o.picker + 1) % G.players.length;
  G.open = null;
  save(); render();
  const gains = net.map((d, i) => d ? name(i) + ' ' + (d > 0 ? '+' : '') + fmt(d) : null).filter(Boolean);
  toast(gains.length ? gains.join(' · ') : 'Nobody scored. The groom is a mystery.');
  if (boardDone()) setTimeout(() => toast('Board cleared. Time for Final ' + DATA.groom + 'pardy.'), 2600);
}
function scoreOpen(nobody) {
  const o = G.open, n = G.players.length, deltas = new Array(n).fill(0);
  if (!nobody) {
    Object.keys(o.marks).forEach(k => {
      const i = +k, m = o.marks[k], pts = pointsFor(o, i);
      if (m === 'right') {
        deltas[i] += pts;
        if (o.chaos === 'steal' && i !== o.leader) deltas[o.leader] -= pts;
      } else if (m === 'wrong') {
        deltas[i] -= pts;
      }
    });
  }
  if (o.bonus != null && BONUS[o.chaos]) deltas[o.bonus] += BONUS[o.chaos].pts;
  finishClue(deltas);
}
function undoLast() {
  if (!G || !G.undo) return;
  const u = G.undo;
  u.net.forEach((d, i) => { if (G.players[i]) G.players[i].score -= d; });
  delete G.used[u.key];
  G.picker = u.picker;
  G.undo = null;
  save(); render();
  toast('Undone. That tile is back on the board.');
}
function putBack() {
  const o = G.open;
  G.players.forEach((p, i) => { p.score = o.atOpen[i]; });
  G.open = null; G.wheel = null;
  save(); render();
}
function startFinal() {
  G.phase = 'final';
  G.final = { step: 'wager', wagers: G.players.map(() => ''), marks: {} };
  G.open = null; G.wheel = null;
  save(); view = 'final'; render(); window.scrollTo(0, 0);
}
function finalMax(i) { return Math.max(0, G.players[i].score); }

/* ---------- rendering ---------- */
function render() {
  let html = '';
  if (view === 'lobby') html = viewLobby();
  else if (view === 'laws') html = viewLaws();
  else if (view === 'board') html = viewBoard();
  else if (view === 'final') html = viewFinal();
  else if (view === 'winner') html = viewWinner();
  else if (view === 'gate') html = viewGate();
  else if (view === 'setup') html = viewSetup();
  else if (view === 'spy-deal') html = viewSpyDeal();
  else if (view === 'spy-vote') html = viewSpyVote();
  if ((view === 'board') && G && G.open) html += viewClue();
  if (G && G.wheel && (view === 'board')) html += viewWheel();
  if (msgOpen) html += viewMessage();
  app.innerHTML = html;
  afterRender();
}
function afterRender() {
  $$('video', app).forEach(v => v.addEventListener('error', () => {
    const note = document.createElement('p'); note.className = 'vid-missing';
    note.textContent = 'This video can’t play here. The written answer still counts.';
    v.replaceWith(note);
  }, { once: true }));
  const cv = $('#wheel', app);
  if (cv && G && G.wheel) drawWheel(cv, G.wheel.angle || 0);
  if (view === 'setup') $$('textarea[data-grow]', app).forEach(grow);
  document.body.style.overflow = (G && G.open && view === 'board') || msgOpen || (G && G.wheel && view === 'board') ? 'hidden' : '';
}
/* text boxes in setup grow to fit what's typed */
function grow(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 4) + 'px'; }
function focusOverlay() { const b = $('.overlay:last-of-type .btn.primary', app) || $('.overlay:last-of-type button', app); if (b) b.focus({ preventScroll: true }); }

function logo(small) { return '<h1 class="logo' + (small ? ' small' : '') + '">' + esc(DATA.groom.toUpperCase()) + '<span>PARDY!</span></h1>'; }

function viewLobby() {
  const b = blanks(DATA);
  const inProgress = G && G.phase !== 'done';
  const rows = roster.map((p, i) => `
    <div class="player-row">
      <div class="field"><label for="pname-${i}">Contestant ${i + 1}</label><input type="text" id="pname-${i}" data-roster="${i}" data-k="name" value="${esc(p.name)}" maxlength="30" autocomplete="off"></div>
      <div class="field"><label for="prole-${i}">Role</label><select id="prole-${i}" data-roster="${i}" data-k="role">${Object.keys(ROLES).map(r => `<option value="${r}"${p.role === r ? ' selected' : ''}>${ROLES[r]}</option>`).join('')}</select></div>
      <button class="btn ghost x" data-act="roster-del" data-i="${i}" aria-label="Remove ${esc(p.name || 'contestant')}"${roster.length <= 2 ? ' disabled' : ''}>×</button>

  return `<main class="wrap narrow">
    <header class="marquee">
      <p class="eyebrow">Bachelorette chaos edition</p>

    </header>

    <section class="panel" aria-labelledby="h-c">
      <h2 id="h-c">Contestants</h2>
      ${rows}
      <div class="actions"><button class="btn ghost" data-act="roster-add"${roster.length >= 6 ? ' disabled' : ''}>Add a contestant</button></div>    </section>
    <section class="panel how" aria-labelledby="h-h">
      <h2 id="h-h">How to run it</h2>
      <ol>
        <li>Put this on a screen everyone can see. Whoever taps is the host, and the host can play too.</li>
        <li>The picker chooses a tile. Everyone secretly writes down a letter, or an answer for write-in questions. No peeking.</li>
        <li>Tap reveal to show the groom’s answer, then tap everyone who got it right. The board does the math.</li>
        <li>Some tiles hide chaos. Read the card out loud and do what it says.</li>

      ${inProgress ? `<button class="btn primary big" data-act="resume">Resume the game</button>` : ''}
      ${G && G.phase === 'done' ? `<button class="btn ghost" data-act="resume">See the last results</button>` : ''}
      <button class="btn ${inProgress ? '' : 'primary big'}" data-act="to-laws">${inProgress ? 'Start a new game' : 'Read the laws'}</button>
    </div>
    <footer class="actions"><button class="link" data-act="gate">Groom setup</button></footer>
  </main>`;
}

function lawsList() {
  return `<ol class="laws">
    <li><div><strong>Answer in the form of a question.</strong><span class="muted">Even multiple choice. “What is B?” Forgetting costs 50 points, unless the host is feeling generous.</span></div></li>
    <li><div><strong>His name is forbidden.</strong><span class="muted">Tonight he is only “the groom.” Saying “${esc(DATA.groom)}” costs 25 points every time. The scoreboard keeps count.</span></div></li>
    <li><div><strong>The groom is the judge.</strong><span class="muted">His phone is on all night. Any dispute or tie, call him, and his ruling is final. If he doesn’t pick up, the bride rules.</span></div></li>
    <li><div><strong>Bribes are legal.</strong><span class="muted">Snacks, compliments, and favors are all accepted, including bribes texted to the judge. The host must announce every bribe out loud.</span></div></li>
    <li><div><strong>The groom’s answer is the official answer.</strong><span class="muted">Even when it’s wrong. “Close enough” is the judge’s call.</span></div></li>

}
function powerCards(players) {

}
function viewLaws() {

    ${((G && lawsBack === 'board') ? !!G.spy : (spyOn && players.length >= 3)) ? `<section class="panel" aria-labelledby="h-s"><h2 id="h-s">There’s a spy among us</h2><p>One contestant has a secret sabotage mission. Before the final round, everyone votes on who it is. Catch the spy and they lose 300. Miss, and the spy gets 300, plus 300 more if they pulled off their mission.</p></section>` : ''}
    <div class="actions">

    </div>

function viewSpyVote() {
  const s = G.spy, spy = s.idx;
  let body;
  if (s.step === 'accuse') {
    body = `<p class="kicker">Before the final round</p><h1 class="logo small">WHO’S THE<br><span>SPY?</span></h1>
      <p class="chaos-rule">Talk it out. Make accusations. Then vote. Majority wins, and the bride breaks ties.</p>
      <div class="chips">${G.players.map((p, i) => `<button class="chip${s.accused === i ? ' pick' : ''}" data-act="accuse" data-i="${i}">${esc(p.name)}</button>`).join('')}</div>

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawWheel(cv, angle) {
  const ctx = cv.getContext('2d'), W = cv.width, R = W / 2 - 12, cx = W / 2, cy = W / 2, seg = Math.PI * 2 / WHEEL.length;
  const fills = [cssVar('--board-hi'), cssVar('--chaos'), cssVar('--board'), cssVar('--gold')];
  const inks = [cssVar('--ink'), cssVar('--chaos-ink'), cssVar('--ink'), cssVar('--gold-ink')];
  ctx.clearRect(0, 0, W, W);
  ctx.beginPath(); ctx.arc(cx, cy, R + 10, 0, Math.PI * 2); ctx.fillStyle = cssVar('--shadow'); ctx.fill();
  WHEEL.forEach((s, i) => {
    const a0 = angle + i * seg;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a0 + seg); ctx.closePath();
    ctx.fillStyle = fills[i % 4]; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = cssVar('--shadow'); ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(a0 + seg / 2);
    ctx.fillStyle = inks[i % 4]; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.font = '40px Anton, Impact, sans-serif';
    ctx.fillText(s.label, R - 26, 0);
    ctx.restore();
  });
  ctx.beginPath(); ctx.arc(cx, cy, 46, 0, Math.PI * 2); ctx.fillStyle = cssVar('--gold'); ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = cssVar('--shadow'); ctx.stroke();
}
function spinWheel() {
  const w = G.wheel; if (!w || w.spinning || w.idx != null) return;
  const idx = Math.floor(Math.random() * WHEEL.length), seg = Math.PI * 2 / WHEEL.length;
  const jitter = (Math.random() - 0.5) * seg * 0.7;
  const base = -Math.PI / 2 - (idx + 0.5) * seg + jitter;
  const from = w.angle || 0;
  let to = base; while (to < from + Math.PI * 2 * 5) to += Math.PI * 2;
  const finish = () => { w.spinning = false; w.idx = idx; w.angle = to % (Math.PI * 2); save(); render(); focusOverlay(); };
  if (reduced()) { w.angle = to; finish(); return; }
  w.spinning = true; render();
  const cv = $('#wheel', app), t0 = performance.now(), dur = 3800;
  const step = now => {
    const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 4);
    const a = from + (to - from) * e;
    if (cv && cv.isConnected) drawWheel(cv, a);
    if (t < 1) requestAnimationFrame(step); else finish();
  };
  requestAnimationFrame(step);
}

function confetti() {

  const bits = Array.from({ length: 160 }, () => ({ x: Math.random() * cv.width, y: -Math.random() * cv.height * 0.6, vx: (Math.random() - 0.5) * 3 * dpr, vy: (2 + Math.random() * 4) * dpr, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, w: (6 + Math.random() * 8) * dpr, h: (8 + Math.random() * 10) * dpr, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  const step = now => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.r += b.vr; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore(); });

  };

    case 'save': doSave(); break;
    case 'values-reset': draft.values = DEFAULT_VALUES.slice(); persistDraft(); render(); toast('Point values are back to 100–600.'); break;
    case 'vremove': setPath(draft, t.dataset.path, null); persistDraft(); render(); break;
    case 'slot-add': {
      const key = t.dataset.k; openSlots.add(key); render();
      const q = $('#q-' + key, app); if (q) q.focus();
      break;
    }
    case 'slot-remove': {
      const key = t.dataset.k;
      if (wasArmed !== 'rm-' + key) { armed = 'rm-' + key; render(); return; }
      armed = null;
      const [ci, ri] = key.split('-').map(Number);
      draft.categories[ci].clues[ri] = blankClue(); openSlots.delete(key);
      persistDraft(); render(); toast('Deleted.');
      break;
    }
    case 'to-bench': {
      const key = t.dataset.k, [ci, ri] = key.split('-').map(Number);
      draft.bench.unshift(Object.assign(clone(draft.categories[ci].clues[ri]), { from: draft.categories[ci].name }));
      draft.categories[ci].clues[ri] = blankClue(); openSlots.delete(key);
      persistDraft(); render(); toast('Moved to the bench.');
      break;
    }
    case 'bench-move': {
      const bi = +t.dataset.b, sel = $('#bm-' + bi, app);
      if (!sel || !sel.value) return;
      const [ci, ri] = sel.value.split('-').map(Number);
      const item = clone(draft.bench[bi]); delete item.from;
      draft.categories[ci].clues[ri] = normClue(item);
      draft.bench.splice(bi, 1);
      persistDraft(); render(); toast('Moved to ' + (draft.categories[ci].name || 'the board') + ' for ' + draft.values[ri] + '.');
      break;
    }
    case 'bench-remove': {
      const bi = +t.dataset.b;
      if (wasArmed !== 'rmb-' + bi) { armed = 'rmb-' + bi; render(); return; }
      armed = null; draft.bench.splice(bi, 1); persistDraft(); render(); toast('Deleted.');
      break;
    }
    case 'copy': {
      const text = JSON.stringify(draft, null, 2);
      const done = () => toast('Setup copied.');
      const fallback = () => { copyText = text; render(); const b = $('#copybox', app); if (b) { b.focus(); b.select(); } toast('Copy the text in the box below.'); };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (err) { fallback(); }
      break;
    }
    case 'download':
      if (!cap.downloads) return;
      cap.downloads.save({ filename: (draft.groom || 'groom').toLowerCase().replace(/[^a-z0-9]+/g, '') + 'pardy.html', data: buildHtml(draft) })
        .then(() => toast('Downloaded.'), err => { if (err && err.code !== 'declined') toast('Download isn’t available here.'); });
      break;
  }
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.roster != null) { roster[+t.dataset.roster][t.dataset.k] = t.value; ls.set(RKEY, roster); return; }
  if (t.dataset.fw != null && G && G.final) { G.final.wagers[+t.dataset.fw] = t.value; save(); return; }
  if (t.dataset.grow != null) grow(t);
  if (t.id === 's-prize') { const c = $('#prize-count', app); if (c) c.textContent = fmt(t.value.length) + ' / ' + fmt(PRIZE_MAX); }
  if (t.dataset.path && draft) {
    setPath(draft, t.dataset.path, t.value);
    const m = t.dataset.path.match(/^(categories\.\d\.clues\.\d|bench\.\d+)\.(q|a|why|opts\.\d)$/);
    if (m) clearPre(getPath(draft, m[1]), t);
    persistDraft();
  }
});
/* Any edit to a pre-filled question means the groom has checked it. */
function clearPre(cl, el) {
  if (!cl || !cl.pre) return;
  cl.pre = false;
  const box = el.closest('.clue-fields'), b = box && $('.badge.check', box);
  if (b) b.remove();
}
app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'spy-on') { spyOn = t.checked; ls.set('aaronpardy-spy-v1', spyOn); return; }
  if (t.dataset.roster != null) { roster[+t.dataset.roster][t.dataset.k] = t.value; ls.set(RKEY, roster); return; }
  if (t.dataset.mc && draft) { const cl = getPath(draft, t.dataset.mc); cl.mc = t.value === '1'; cl.pre = false; persistDraft(); render(); return; }
  if (t.dataset.correct && draft) { const cl = getPath(draft, t.dataset.correct); cl.correct = +t.value; clearPre(cl, t); persistDraft(); return; }
  if (t.dataset.vpath) uploadVideo(t);
  if (t.dataset.val != null && draft) {
    const r = +t.dataset.val, n = Math.round(+t.value);
    if (n > 0 && n <= 100000) { draft.values[r] = n; persistDraft(); }
    /* redraw after focus has moved on (Tab to the next row), then put focus back where it went */
    setTimeout(() => { const id = document.activeElement && document.activeElement.id; render(); const el = id && document.getElementById(id); if (el) el.focus({ preventScroll: true }); }, 0);
    return;
  }
  if (t.dataset.worth && draft) moveWorth(t.dataset.worth, +t.value);
});
/* Change one question's worth: it trades places with whatever sits at that value in the same category. */
function moveWorth(key, to) {
  const [ci, ri] = key.split('-').map(Number);
  if (to === ri || !(to >= 0 && to < ROWS)) return;
  const clues = draft.categories[ci].clues, other = clues[to];
  clues[to] = clues[ri]; clues[ri] = other;
  const dest = ci + '-' + to;
  openSlots.delete(key); openSlots.delete(dest);
  armed = null;
  persistDraft(); render();
  const v = draft.values;
  toast(hasContent(other) ? `Now worth ${v[to]}. The old ${v[to]} question is worth ${v[ri]} now.` : `Now worth ${v[to]}.`);
  const box = $('#ce-' + dest, app), sel = $('#wv-' + dest, app);
  if (box) box.scrollIntoView({ block: 'center', behavior: reduced() ? 'auto' : 'smooth' });
  if (sel) sel.focus({ preventScroll: true });
}
/* Answer options are one line on the board, so Enter doesn't add a line break there. */
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('opt-input')) e.preventDefault(); });

render();
})();
</script>
