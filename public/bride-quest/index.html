<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Bride Quest</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style id="css">
/* Layout: a JRPG menu on a snowy night. Double-bordered blue windows stack in one phone-width column; gold is XP and progress, cranberry is new, hidden or dangerous, pine is done. Single dark look on purpose. */
:root{
  --night:#0a0f24; --night-2:#18215a; --scrim:rgba(4,7,22,.86); --snow:rgba(255,255,255,.55);
  --win-top:#2c47bd; --win-bot:#101d68; --win-edge:#eef2ff; --win-line:#06103f; --hover:rgba(255,255,255,.09);
  --ink:#f5f7ff; --muted:#b8c2ef; --dim:#7d89c2;
  --gold:#ffd35c; --gold-hi:#ffe9a3; --gold-ink:#2b1e00;
  --holly:#ff4f6d; --holly-ink:#fff5f7;
  --pine:#46d993; --pine-ink:#042a1b;
  --rare:#86d8ff; --common:#c9d2f5;
  --chest:#b5642f; --chest-lo:#6d3418;
  --f-pixel:"DotGothic16","Courier New",monospace;
  --f-body:"M PLUS Rounded 1c","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--night);background-image:radial-gradient(120% 70% at 50% -10%,var(--night-2),var(--night) 62%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
body::after{content:"";position:fixed;left:0;right:0;top:-220px;bottom:0;pointer-events:none;z-index:0;background-image:radial-gradient(2px 2px at 24px 30px,var(--snow) 50%,transparent 52%),radial-gradient(2px 2px at 90px 130px,var(--snow) 50%,transparent 52%),radial-gradient(3px 3px at 160px 70px,var(--snow) 50%,transparent 52%),radial-gradient(2px 2px at 210px 170px,var(--snow) 50%,transparent 52%),radial-gradient(2px 2px at 50px 190px,var(--snow) 50%,transparent 52%);background-size:240px 220px;animation:snow 22s linear infinite;opacity:.7}
@keyframes snow{from{transform:translateY(0)}to{transform:translateY(220px)}}
#app{position:relative;z-index:1}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
p{margin:0}
h1,h2,h3{margin:0;font-weight:400}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:14px}

.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 56px;display:flex;flex-direction:column;gap:16px}
.wrap.wide{max-width:760px}

/* windows */
.win{background:linear-gradient(180deg,var(--win-top),var(--win-bot));border:2px solid var(--win-edge);border-radius:10px;box-shadow:inset 0 0 0 2px var(--win-line),0 5px 0 var(--win-line);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.win-title{font-family:var(--f-pixel);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.note{border:2px dashed var(--holly);border-radius:8px;padding:10px 12px;color:var(--holly-ink);font-weight:700;font-size:15px}

/* buttons */
.btn{font-family:var(--f-pixel);font-size:17px;letter-spacing:.03em;min-height:48px;padding:10px 18px;border-radius:8px;border:2px solid var(--win-edge);background:var(--win-line);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.2;text-decoration:none}
.btn:hover{background:var(--win-bot)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.gold:hover{background:var(--gold-hi)}
.btn.holly{background:var(--holly);border-color:var(--holly);color:var(--holly-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:38px;font-size:14px;padding:6px 12px}
.btn.big{min-height:56px;font-size:19px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px;align-self:flex-start}
.link.danger{color:var(--holly)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* status window */
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero-id{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero-name{background:none;border:0;padding:0;text-align:left;font-family:var(--f-pixel);font-size:34px;line-height:1.05;cursor:pointer;overflow-wrap:anywhere}
.hero-title{font-weight:700;color:var(--gold)}
.lv{font-family:var(--f-pixel);text-align:right;line-height:1;white-space:nowrap}
.lv span{font-size:16px;color:var(--muted);margin-right:2px}
.lv b{font-weight:400;font-size:52px;color:var(--gold);text-shadow:3px 3px 0 var(--win-line)}
.xpbar,.hpbar{height:16px;border:2px solid var(--win-edge);border-radius:4px;background:var(--win-line);overflow:hidden}
.xpbar i,.hpbar i{display:block;height:100%;transition:width .7s cubic-bezier(.2,.9,.3,1)}
.xpbar i{background:repeating-linear-gradient(90deg,var(--gold) 0 10px,var(--gold-hi) 10px 12px)}
.hpbar i{background:repeating-linear-gradient(90deg,var(--holly) 0 10px,var(--holly-ink) 10px 11px)}
.xpline{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-pixel);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.party{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:flex;flex-direction:column;align-items:flex-start;gap:0;border:2px solid var(--muted);border-radius:8px;background:var(--win-line);padding:6px 12px;cursor:pointer;min-width:0;flex:1 1 140px;text-align:left}
.pchip b{font-family:var(--f-pixel);font-weight:400;font-size:17px}
.pchip span{font-size:13px;color:var(--muted)}
.twist{display:flex;gap:10px;align-items:baseline;border-top:1px solid var(--muted);padding-top:10px;font-size:15px}
.twist span{font-family:var(--f-pixel);color:var(--holly);font-size:13px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}.timer-row{align-items:center;justify-content:space-between}.timer-row span{white-space:normal}.qtimer{font-family:var(--f-pixel);font-variant-numeric:tabular-nums;color:var(--gold);font-size:20px;letter-spacing:.05em;white-space:nowrap}.qtimer.up{color:var(--holly);animation:blink 1s steps(2) infinite}.pop-timer{text-align:center;margin:6px 0 2px}.pop-timer .qtimer{font-size:44px}
.live{font-family:var(--f-pixel);font-size:13px;color:var(--pine);letter-spacing:.06em}
.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pine);margin-right:8px;vertical-align:1px;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.ownerbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tab{font-family:var(--f-pixel);font-size:17px;min-height:46px;border:2px solid transparent;border-radius:8px;background:var(--win-line);cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--gold);color:var(--gold)}
.tab[aria-selected="true"]::before{content:"\25B6";font-size:12px;margin-right:6px}

/* code entry */
.code-row{display:flex;gap:8px}
.code-row input{flex:1 1 auto;min-width:0;font-family:var(--f-pixel);font-size:20px;letter-spacing:.12em;text-transform:uppercase}

/* quests */
.chap{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.chap h2{font-family:var(--f-pixel);font-size:20px;line-height:1.2}
.chap .time{font-family:var(--f-pixel);font-size:13px;color:var(--muted);white-space:nowrap}
.qlist{display:flex;flex-direction:column;gap:2px;margin-inline:-8px}
.qrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;background:transparent;border:0;border-left:3px solid transparent;border-radius:6px;padding:9px 8px;text-align:left;cursor:pointer;color:var(--ink);min-height:52px}
.qrow:hover,.qrow:focus-visible{background:var(--hover);border-left-color:var(--gold)}
.qrow.locked{cursor:default;opacity:.55}
.qrow.locked:hover{background:transparent;border-left-color:transparent}
.gem{font-family:var(--f-pixel);font-size:18px;text-align:center;line-height:1}
.t-main{color:var(--gold)} .t-common{color:var(--common)} .t-rare{color:var(--rare)} .t-legendary{color:var(--holly)} .t-hidden{color:var(--holly)} .t-done{color:var(--pine)}
.qmain{display:flex;flex-direction:column;min-width:0}
.qtitle{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.qsub{font-size:13px;color:var(--muted)}
.qxp{font-family:var(--f-pixel);color:var(--gold);font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.qrow.done .qtitle{color:var(--muted)}
.qrow.done .qxp{color:var(--pine)}
.newtag{display:inline-block;font-family:var(--f-pixel);font-size:11px;letter-spacing:.08em;background:var(--holly);color:var(--holly-ink);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;overflow-y:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov.pop-ov{z-index:70}
.ov > .win{margin:auto;width:100%;max-width:560px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{background:var(--win-line);border:2px solid var(--win-edge);border-radius:8px;min-width:44px;min-height:44px;cursor:pointer;font-size:18px}
.sheet-title{font-family:var(--f-pixel);font-size:28px;line-height:1.15;overflow-wrap:anywhere}
.sheet-text{font-size:18px;line-height:1.55;white-space:pre-wrap}
.done-note{font-weight:700;color:var(--pine)}
.vid{width:100%;max-height:52vh;border-radius:8px;background:var(--win-line);border:2px solid var(--win-edge)}
.vid-missing{font-size:14px;color:var(--muted)}
.proof{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.proof img{width:100%;max-height:46vh;object-fit:contain;border-radius:8px;border:2px solid var(--win-edge);background:var(--win-line)}

/* level up and popups */
.pop{text-align:center;align-items:center}
.lvup-big{font-family:var(--f-pixel);font-size:clamp(40px,12vw,64px);line-height:1;color:var(--gold);text-shadow:3px 3px 0 var(--win-line),6px 6px 0 var(--holly);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
.lvup-line{font-size:19px}
.lvup-line b{font-family:var(--f-pixel);font-weight:400;color:var(--gold)}
.lvup-title{font-family:var(--f-pixel);font-size:24px}
.chest-btn{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border:2px dashed var(--gold);border-radius:12px;padding:14px 22px;cursor:pointer;font-family:var(--f-pixel);color:var(--gold);font-size:17px;animation:wiggle 1.4s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}95%{transform:rotate(-2deg)}}
.loot{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left;border:2px solid var(--gold);border-radius:10px;padding:12px 14px;background:var(--win-line)}
.loot h3{font-family:var(--f-pixel);font-size:22px;color:var(--gold)}
.loot-text{white-space:pre-wrap;font-size:17px;line-height:1.6}
.twistcard{width:100%;border:2px solid var(--holly);border-radius:10px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.twistcard p:last-child{font-size:18px;font-weight:700}
.bang{font-family:var(--f-pixel);font-size:72px;line-height:1;color:var(--holly);text-shadow:4px 4px 0 var(--win-line);animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(2.5);opacity:0}to{transform:scale(1);opacity:1}}
.pop-head{font-family:var(--f-pixel);font-size:24px;line-height:1.2}
.pop-head b{font-weight:400;color:var(--gold)}
.msg{font-size:20px;line-height:1.55;white-space:pre-wrap;text-align:left;width:100%}

/* party card */
.card{text-align:center;align-items:center}
.card .cls{font-family:var(--f-pixel);font-size:30px;color:var(--gold);line-height:1.1}
.card .who{font-family:var(--f-pixel);font-size:22px}
.card .ability{font-size:20px;line-height:1.5;max-width:30ch}

/* santa */
.santa{display:flex;flex-direction:column;gap:10px;align-items:stretch;border:2px solid var(--gold);border-radius:10px;padding:12px;background:var(--win-line);text-align:center}
.santa .big{font-family:var(--f-pixel);font-size:26px;color:var(--gold);line-height:1.2}

/* bingo */
.bingo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.cell{min-height:86px;font-size:12.5px;line-height:1.25;padding:6px 4px;border:2px solid var(--win-edge);border-radius:6px;background:var(--win-line);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;min-width:0}
.cell.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.cell.free{background:var(--pine);color:var(--pine-ink);border-color:var(--pine);cursor:default}

/* boss */
.boss{display:flex;flex-direction:column;gap:10px;border:2px solid var(--holly);border-radius:10px;padding:12px;background:var(--win-line)}
.boss-name{font-family:var(--f-pixel);font-size:24px;color:var(--holly);line-height:1.15}
.attacks{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.atk{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n d" "t t";gap:2px 10px;text-align:left;border:2px solid var(--win-edge);border-radius:8px;background:var(--win-bot);padding:10px 12px;cursor:pointer;min-width:0}
.atk:hover{border-color:var(--holly)}
.atk[disabled]{opacity:.4;cursor:not-allowed}
.atk-name{grid-area:n;font-family:var(--f-pixel);font-size:17px}
.atk-dmg{grid-area:d;font-family:var(--f-pixel);color:var(--holly);font-size:15px;white-space:nowrap}
.atk-text{grid-area:t;font-size:14px;color:var(--muted)}
.blog{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.blog li:first-child{color:var(--gold);font-weight:700}

/* log, loot, stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.stats b{display:block;font-family:var(--f-pixel);font-weight:400;font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.log{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.log li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:15px}
.log .time{font-family:var(--f-pixel);font-size:13px;color:var(--muted);white-space:nowrap}
.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.shots img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:2px solid var(--win-edge);display:block;max-width:100%}
.foot{display:flex;justify-content:center}

/* credits */
.credits-ov{z-index:80;background:var(--night);overflow:hidden;padding:0}
.credits{position:absolute;inset:0;overflow-y:auto;text-align:center}
.roll{display:flex;flex-direction:column;align-items:center;gap:10px;padding:max(48px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 140px max(16px,env(safe-area-inset-left,0px));animation:roll 48s linear forwards}
.roll.static{animation:none}
@keyframes roll{from{transform:translateY(55vh)}to{transform:translateY(-100%)}}
.cr-big{font-family:var(--f-pixel);font-size:clamp(40px,11vw,72px);color:var(--gold);line-height:1;text-shadow:4px 4px 0 var(--holly)}
.cr-sub{color:var(--muted);font-size:17px}
.cr-h{font-family:var(--f-pixel);color:var(--holly);font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin-top:26px}
.cr-role{font-size:20px}
.cr-role b{font-family:var(--f-pixel);font-weight:400;color:var(--gold)}
.cr-line{font-size:17px}
.credits .shots{width:100%;max-width:520px;margin-top:20px}
.cr-close{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:81}

/* groom HQ */
.hq-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.hq-title{font-family:var(--f-pixel);font-size:40px;color:var(--gold);line-height:1;text-shadow:3px 3px 0 var(--holly)}
.hq-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:6px;border-top:1px solid var(--win-line)}
.hq-row:first-of-type{border-top:0}
.hq-row > div{min-width:0}
.tagok{font-family:var(--f-pixel);font-size:14px;color:var(--pine);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-pixel);font-size:16px;min-height:42px;padding:6px 14px;border:2px solid var(--win-edge);border-radius:999px;background:var(--win-line);cursor:pointer}
.chip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.feed{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.feed li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center}
.feed img,.feed .nophoto{width:64px;height:64px;object-fit:cover;border-radius:6px;border:2px solid var(--win-edge);background:var(--win-line);display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center;line-height:1.2}

/* forms and editor */
.field > label,.label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=url],textarea,select{font:16px var(--f-body);background:var(--win-line);color:var(--ink);border:2px solid var(--muted);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.45;field-sizing:content;max-height:60vh}
input:focus,textarea:focus,select:focus{border-color:var(--gold);outline:none}
input[disabled]{opacity:.5}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:end}
.ed-grid.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.ed-item{display:flex;flex-direction:column;gap:10px;padding-block:14px;border-top:1px solid var(--muted)}
.ed-item:first-of-type{border-top:0}
.check{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);cursor:pointer;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--gold);margin:0}
.savebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--night);border-bottom:2px solid var(--win-line);padding-block:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.savebar .status{font-size:14px;color:var(--muted)}
.savebar .status b{color:var(--holly-ink)}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;border:2px solid var(--holly);color:var(--holly-ink)}
.vrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.vrow video{width:180px;max-width:100%;border-radius:6px;background:var(--win-line)}
.copybox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:200px}
.big-title{font-family:var(--f-pixel);font-size:clamp(36px,9vw,56px);color:var(--gold);line-height:1;text-shadow:3px 3px 0 var(--holly)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--night);font-family:var(--f-pixel);font-size:16px;padding:12px 18px;border-radius:8px;box-shadow:0 6px 0 var(--win-line);max-width:min(520px,calc(100vw - 32px));text-align:center}
.boot{min-height:60vh;display:grid;place-items:center;font-family:var(--f-pixel);font-size:20px;color:var(--muted)}

@media (max-width:420px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ed-grid{grid-template-columns:minmax(0,1fr) 90px}
  .cell{min-height:80px;font-size:11.5px;padding:5px 3px}
  .bingo{gap:4px}
  .ov{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .ov > .win{padding:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script id="main">
(() => {

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);

const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));

const rid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const reduced = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const ls = mkStore('localStorage'), ss = mkStore('sessionStorage');
const LKEY = 'bridequest-local-v1', DKEY = 'bridequest-draft-v1', RESCUE = 'bridequest-rescue-v1';

/* ---------- quest data ---------- */
const TIERS = { main: 'Main quest', common: 'Common', rare: 'Rare', legendary: 'Legendary' };
const TYPES = ['normal', 'santa', 'bingo', 'boss'];
const CH_IDS = ['call', 'workshop', 'side', 'dungeon', 'finale', 'hidden'];
const TYPE_NOTE = { santa: 'This quest has the Secret Santa name draw built in.', bingo: 'This quest shows the bingo card. Edit the squares further down.', boss: 'This quest runs the boss battle. Edit the boss further down.' };
function normLoot(l) { l = l && typeof l === 'object' ? l : {}; return { title: String(l.title || ''), text: String(l.text || ''), link: String(l.link || ''), video: l.video || null, hint: String(l.hint || '') }; }
function normQuest(q) {

  const id = /^[A-Za-z0-9_-]{1,60}$/.test(q.id || '') ? q.id : 'q_' + rid();

    title: String(q.title || ''), text: String(q.text || ''), xp: Math.max(0, Math.round(+q.xp || 0)), photo: !!q.photo,
    code: String(q.code || '').toUpperCase().replace(/[^A-Z0-9]/g, ''), link: String(q.link || ''), video: q.video || null

function normalize(d) {
  d = d && typeof d === 'object' ? d : {};
  const party = (Array.isArray(d.party) && d.party.length ? d.party : [{ name: 'Savea' }]).slice(0, 6).map(p => ({ name: String((p && p.name) || ''), cls: String((p && p.cls) || ''), tag: String((p && p.tag) || ''), ability: String((p && p.ability) || '') }));

const qById = id => DATA.quests.find(q => q.id === id);

/* ---------- shared state (live in db, or on this phone) ----------

const COLS = ['done', 'unlocked', 'pushes', 'twists', 'run'];

  view: 'board', tab: 'quests', sheet: null, card: null, popup: null, chest: false, lvQueue: [], pushQueue: [], victory: false,
  armed: null, credits: false, liveNote: '', fresh: false, slow: false, photos: {}, pending: {}, busy: {}, award: 100, qtimer: 0,

};
const unsubs = [];
let draft = null, dirty = false, copyText = null, pendingRender = false;

function loaded() { return mode === 'local' || (mode === 'live' && COLS.every(k => got[k])); }
function loadLocal() { const L = ls.get(LKEY) || {}; COLS.forEach(k => { S[k] = (L[k] && typeof L[k] === 'object') ? L[k] : {}; }); }
function saveLocal() { const o = {}; COLS.forEach(k => { o[k] = S[k]; }); ls.set(LKEY, o); }
function applyLocal(path, data) {
  const [k, id] = path.split('/');

}
const queues = {};
function serial(path, fn) { const prev = queues[path] || Promise.resolve(); const p = prev.then(fn, fn); queues[path] = p.catch(() => {}); return p; }
function goLocal(note) {
  if (mode === 'local') return;
  mode = 'local'; unsubs.splice(0).forEach(u => { try { u(); } catch (e) {} });

async function put(path, data) {
  applyLocal(path, data);

    onState(true);

function subscribe() {
  const timer = setTimeout(() => { ui.slow = true; if (!ui.fresh) { ui.liveNote = 'Can’t reach the live game yet. Hang on, or check the Wi-Fi.'; onState(); } }, 10000);
  const fresh = snap => { if (snap && snap.metadata && !snap.metadata.fromCache && !ui.fresh) { ui.fresh = true; clearTimeout(timer); if (/reach the live/.test(ui.liveNote)) ui.liveNote = ''; } };
  const err = e => {
    clearTimeout(timer); ui.slow = true;
    const code = e && e.code;
    if (['revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'invalid_argument'].includes(code)) goLocal('Lost the live connection, so progress stays on this phone now.');
    else { ui.liveNote = 'The live connection dropped. Reload the page to reconnect.'; onState(); }
  };
  COLS.forEach(k => unsubs.push(db.collection(k).onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); }); S[k] = o; got[k] = true; fresh(snap); onState();
  }, err)));
}

/* ---------- photos kept on this phone ---------- */
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try { const r = indexedDB.open('bridequest', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch (e) { rej(e); }
  }));
  const tx = (m, fn) => open().then(d => new Promise((res, rej) => { const t = d.transaction('photos', m); fn(t.objectStore('photos')); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }));
  return {
    put: (k, v) => tx('readwrite', s => s.put(v, k)),
    clear: () => tx('readwrite', s => s.clear()),
    all: () => open().then(d => new Promise((res, rej) => { const out = {}; const c = d.transaction('photos').objectStore('photos').openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } else res(out); }; c.onerror = () => rej(c.error); }))
  };
})();
async function loadPhotos() { try { const all = await idb.all(); Object.keys(all).forEach(k => { if (all[k] instanceof Blob) ui.photos[k] = URL.createObjectURL(all[k]); }); } catch (e) {} }
function photoSrc(id) { if (ui.photos[id]) return ui.photos[id]; const d = S.done[id]; return d && d.photo ? videoSrc(d.photo) : ''; }
function downscale(file, max = 1600, q = 0.82) {
  return new Promise(res => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => res(b || file), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
async function onPhoto(input) {
  const f = input.files && input.files[0], id = input.dataset.photo; if (!f || !id) return;
  ui.busy[id] = 'Saving the photo…'; render(true);
  const blob = await downscale(f);
  try { await idb.put(id, blob); } catch (e) {}
  if (ui.photos[id]) URL.revokeObjectURL(ui.photos[id]);
  ui.photos[id] = URL.createObjectURL(blob);
  let assetId = null;
  if (cap.assets && mode === 'live') {
    ui.busy[id] = 'Sending it to the groom…'; render(true);
    try { assetId = (await cap.assets.upload(blob, { type: blob.type === 'image/png' ? 'image/png' : 'image/jpeg' })).id; }
    catch (e) { toast('Saved on this phone. It didn’t reach the groom.'); }
  }
  delete ui.busy[id];
  if (S.done[id]) { if (assetId) await put('done/' + id, Object.assign({}, S.done[id], { photo: assetId })); else render(true); }
  else { ui.pending[id] = assetId; render(true); }
}

/* ---------- XP and levels ---------- */
function xpTotal() {
  let x = 0;
  Object.keys(S.done).forEach(id => { const q = qById(id); if (q) x += q.xp; });
  Object.keys(S.pushes).forEach(id => { const p = S.pushes[id]; if (p && p.kind === 'xp') x += Math.round(+p.amount || 0); });
  return Math.max(0, x);
}
function levelInfo() {
  const xp = xpTotal(), list = levelsSorted(); let i = 0;
  list.forEach((L, k) => { if (xp >= L.xp) i = k; });
  const cur = list[i], next = list[i + 1];
  const pct = next ? Math.max(0, Math.min(100, Math.round((xp - cur.xp) / Math.max(1, next.xp - cur.xp) * 100))) : 100;
  return { xp, n: i + 1, title: cur.title, next, pct, list };
}
const twistText = n => { const t = S.twists[n]; return t && typeof t.text === 'string' ? t.text : ''; };
function currentTwist() { const lv = levelInfo().n; const keys = Object.keys(S.twists).map(Number).filter(n => n <= lv && twistText(n)).sort((a, b) => b - a); return keys.length ? twistText(keys[0]) : ''; }

/* ---------- popups: level-ups and the groom's pushes (each phone shows each one once) ---------- */
function checkReset() {
  const st = R('state'), r = st && st.resetAt;
  if (!r || ls.get(RKEY) === r) return;
  ls.set(RKEY, r); ls.del(LVKEY); ls.del(PKEY); ui.lvQueue = []; ui.pushQueue = []; ui.victory = false;
  if (ui.popup && ui.popup.kind !== 'push') ui.popup = null;
  Object.keys(ui.photos).forEach(k => URL.revokeObjectURL(ui.photos[k])); ui.photos = {}; ui.pending = {};
  idb.clear().catch(() => {});
}
function checkLevels() {
  const lv = levelInfo().n, seen = ls.get(LVKEY);
  if (seen == null) { ls.set(LVKEY, lv); return; }
  if (lv <= seen) return;
  const roll = [], used = new Set(Object.keys(S.twists).map(twistText));
  for (let n = seen + 1; n <= lv; n++) {
    ui.lvQueue.push(n);
    if (!twistText(n) && DATA.twists.length) { const pool = DATA.twists.filter(t => !used.has(t)); const t = pick(pool.length ? pool : DATA.twists); used.add(t); roll.push([n, t]); }
  }
  ls.set(LVKEY, lv);
  roll.forEach(([n, t]) => put('twists/' + n, { text: t, at: Date.now() }));
}
function checkPushes() {
  const ids = Object.keys(S.pushes).sort((a, b) => (S.pushes[a].at || 0) - (S.pushes[b].at || 0));
  const stored = ls.get(PKEY);
  if (stored == null) { ls.set(PKEY, ids); return; }
  const seen = new Set(stored); let changed = false;
  ids.forEach(id => { if (!seen.has(id)) { seen.add(id); ui.pushQueue.push(id); changed = true; } });
  if (changed) ls.set(PKEY, Array.from(seen));
}
function nextPopup() {
  if (ui.popup) return;
  if (ui.victory) { ui.victory = false; ui.popup = { kind: 'victory' }; return; }
  if (ui.lvQueue.length) { ui.popup = { kind: 'level', n: ui.lvQueue.shift() }; ui.chest = false; return; }
  while (ui.pushQueue.length) { const id = ui.pushQueue.shift(); if (S.pushes[id]) { ui.popup = { kind: 'push', id }; if (S.pushes[id].kind === 'quest' && !isOwner) alarm.ring(20000); return; } }
}
function onState(force) {
  /* popups only once this phone has the real picture (not a stale cached copy) */
  if (mode !== 'boot' && loaded() && (mode === 'local' || ui.fresh || ui.slow) && ui.view === 'board') { checkReset(); checkLevels(); checkPushes(); nextPopup(); }
  if (ui.view === 'setup' || ui.view === 'gate') return;
  render(force);
}

/* ---------- toast ---------- */
let toastEl = null, toastT = null;
function toast(msg) {
  if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role', 'status'); toastEl.setAttribute('aria-live', 'polite'); document.body.appendChild(toastEl); }
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { toastEl.hidden = true; }, 3600);
}

/* ---------- quest actions ---------- */
async function completeQuest(id, quiet) {
  const q = qById(id); if (!q || S.done[id]) return;
  const photo = ui.pending[id] || null; delete ui.pending[id];
  if (ui.sheet === id) ui.sheet = null;
  if (!quiet) toast('Quest complete! +' + fmt(q.xp) + ' XP');
  await put('done/' + id, { at: Date.now(), photo });
}
function bingoLines(marked) {
  const m = new Set(marked), L = [];
  for (let r = 0; r < 4; r++) L.push([0, 1, 2, 3].map(c => r * 4 + c));
  for (let c = 0; c < 4; c++) L.push([0, 1, 2, 3].map(r => r * 4 + c));
  L.push([0, 5, 10, 15], [3, 6, 9, 12]);
  return L.some(line => line.every(p => m.has(p)));
}
const bingoSquares = () => { const sq = DATA.bingo.slice(0, 16); while (sq.length < 16) sq.push('Free space'); return sq; };

/* ---------- rendering ---------- */
function render(force) {
  const ae = document.activeElement;
  if (!force && ae && app.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && !['file', 'checkbox', 'radio'].includes(ae.type)) { pendingRender = true; return; }
  pendingRender = false;
  let html;
  const waiting = mode === 'boot' || (mode === 'live' && !loaded() && !ui.slow && (ui.view === 'board' || ui.view === 'hq'));
  if (waiting) html = `<main class="wrap"><p class="boot">${mode === 'boot' ? 'Loading the quest…' : 'Joining the live game…'}</p></main>`;
  else if (ui.view === 'hq') html = viewHQ();
  else if (ui.view === 'gate') html = viewGate();
  else if (ui.view === 'setup') html = viewSetup();
  else html = viewBoard();
  if (!waiting && (ui.view === 'board' || ui.view === 'hq')) {
    if (ui.sheet) html += viewSheet();
    if (ui.card) html += viewCard();
    if (ui.popup) html += viewPopup();
    if (ui.credits) html += viewCredits();
  }
  app.innerHTML = html;
  after();
}
function after() {
  $$('video', app).forEach(v => v.addEventListener('error', () => {
    const n = document.createElement('p'); n.className = 'vid-missing';
    n.textContent = 'This video won’t play on this device. If there’s a link, use that, or ask the groom to text it.';
    v.replaceWith(n);
  }, { once: true }));
  const roll = $('.roll', app);
  if (roll) { if (reduced()) roll.classList.add('static'); else roll.addEventListener('animationend', () => roll.classList.add('static'), { once: true }); }
  const overlay = (ui.view === 'board' || ui.view === 'hq') && (ui.sheet || ui.card || ui.popup || ui.credits);
  document.body.style.overflow = overlay ? 'hidden' : '';
  /* move focus into a newly opened overlay so keyboards and screen readers land in it */
  const key = overlay ? JSON.stringify([ui.sheet, ui.card && ui.card.kind, ui.popup, ui.credits]) : '';
  if (key && key !== lastOverlay) { const ovs = $$('.ov', app), top = ovs[ovs.length - 1]; const f = top && top.querySelector('button,[href],input'); if (f && !top.contains(document.activeElement)) { try { f.focus({ preventScroll: true }); } catch (e) {} } }
  lastOverlay = key;
}
let lastOverlay = '';
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (ui.credits) { ui.credits = false; render(true); }
  else if (ui.card) { if (ui.card.kind === 'image') URL.revokeObjectURL(ui.card.url); ui.card = null; render(true); }
  else if (ui.sheet && !ui.popup) { ui.sheet = null; render(true); }
});
/* a render that waited for typing to stop runs after the tap that ended it has landed */
app.addEventListener('focusout', () => { setTimeout(() => { if (pendingRender) render(); }, 450); });

/* ---------- scrapbook image ---------- */
function loadImg(src) { return new Promise(res => { const i = new Image(); if (/^https?:/.test(src)) i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }); }
function fitText(g, t, w) { if (g.measureText(t).width <= w) return t; while (t.length > 1 && g.measureText(t + '…').width > w) t = t.slice(0, -1); return t + '…'; }
async function makeScrapbook() {
  const items = doneItems().filter(x => photoSrc(x.q.id)); if (!items.length) return;
  toast('Making the scrapbook…');
  try { await document.fonts.ready; } catch (e) {}
  const L = levelInfo(), W = 1080, cols = 3, cell = 320, gap = 20, pad = 40, cap_ = 52, head = 300, foot = 150;
  const rows = Math.ceil(items.length / cols), H = head + rows * (cell + cap_ + gap) + foot;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const px = cssVar('--f-pixel'), body = cssVar('--f-body');
  g.fillStyle = cssVar('--night'); g.fillRect(0, 0, W, H);
  g.textAlign = 'center'; g.fillStyle = cssVar('--gold'); g.font = '88px ' + px; g.fillText('BRIDE QUEST', W / 2, 130);
  g.fillStyle = cssVar('--ink'); g.font = '700 36px ' + body; g.fillText(fitText(g, `${brideName()} reached Lv. ${L.n} · ${L.title}`, W - 2 * pad), W / 2, 196);
  g.fillStyle = cssVar('--muted'); g.font = '28px ' + body; g.fillText(`${new Date().toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' })} · ${doneItems().length} quests · ${fmt(L.xp)} XP`, W / 2, 246);
  for (let k = 0; k < items.length; k++) {
    const x = pad + (k % cols) * (cell + gap), y = head + Math.floor(k / cols) * (cell + cap_ + gap);
    g.fillStyle = cssVar('--win-edge'); g.fillRect(x - 4, y - 4, cell + 8, cell + 8);
    const img = await loadImg(photoSrc(items[k].q.id));
    if (img) { const s = Math.max(cell / img.naturalWidth, cell / img.naturalHeight), w = img.naturalWidth * s, h = img.naturalHeight * s; g.save(); g.beginPath(); g.rect(x, y, cell, cell); g.clip(); g.drawImage(img, x + (cell - w) / 2, y + (cell - h) / 2, w, h); g.restore(); }
    else { g.fillStyle = cssVar('--win-bot'); g.fillRect(x, y, cell, cell); }
    g.textAlign = 'left'; g.fillStyle = cssVar('--ink'); g.font = '700 24px ' + body; g.fillText(fitText(g, items[k].q.title, cell), x, y + cell + 36);
  }
  g.textAlign = 'center'; g.fillStyle = cssVar('--gold'); g.font = '40px ' + px; g.fillText('TO BE CONTINUED · DECEMBER 1', W / 2, H - 64);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
  if (!blob) { toast('The scrapbook didn’t render. Try again.'); return; }
  if (cap.downloads) {
    try { await cap.downloads.save({ filename: 'bride-quest-scrapbook.jpg', data: blob }); toast('Scrapbook saved.'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  ui.card = { kind: 'image', url: URL.createObjectURL(blob) }; render(true);
}

function confetti() {

  document.body.appendChild(cv);
  const g = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const cols = [cssVar('--gold'), cssVar('--holly'), cssVar('--pine'), cssVar('--ink')];
  const bits = Array.from({ length: 140 }, () => ({ x: Math.random() * cv.width, y: -Math.random() * cv.height * 0.6, vx: (Math.random() - 0.5) * 3 * dpr, vy: (2 + Math.random() * 4) * dpr, s: (5 + Math.random() * 6) * dpr, c: pick(cols) }));
  const t0 = performance.now();
  const step = now => { g.clearRect(0, 0, cv.width, cv.height); bits.forEach(b => { b.x += b.vx; b.y += b.vy; g.fillStyle = b.c; g.fillRect(b.x, b.y, b.s, b.s); }); if (now - t0 < 3800) requestAnimationFrame(step); else cv.remove(); };

    case 'setup': openSetup(); break;
    case 'save': doSave(); break;
    case 'jump': { const el = document.getElementById(t.dataset.to); if (el) { const top = el.getBoundingClientRect().top + window.scrollY - (($('.savebar', app) || {}).offsetHeight || 0) - 12; window.scrollTo({ top, behavior: reduced() ? 'auto' : 'smooth' }); } break; }
    case 'vremove': setPath(draft, t.dataset.path, null); persistDraft(); render(true); break;
    case 'addq': draft.quests.push(normQuest({ ch: t.dataset.ch, tier: t.dataset.ch === 'call' || t.dataset.ch === 'dungeon' || t.dataset.ch === 'finale' ? 'main' : 'common', xp: 100 })); persistDraft(); render(true); break;
    case 'rmq': if (twoTap('rmq-' + t.dataset.q)) { draft.quests = draft.quests.filter(q => q.id !== t.dataset.q); persistDraft(); render(true); } break;
    case 'addlv': { const last = draft.levels[draft.levels.length - 1]; draft.levels.push({ title: '', xp: (last ? last.xp : 0) + 500, loot: normLoot() }); persistDraft(); render(true); break; }
    case 'rmlv': if (twoTap('rmlv')) { draft.levels.pop(); persistDraft(); render(true); } break;
    case 'adda': draft.boss.attacks.push({ name: '', text: '', dmg: 100, repeat: false }); persistDraft(); render(true); break;
    case 'rma': if (twoTap('rma-' + i)) { draft.boss.attacks.splice(i, 1); persistDraft(); render(true); } break;
    case 'copy': {
      const text = JSON.stringify(draft, null, 2);
      const fallback = () => { copyText = text; render(true); const b = $('#copybox', app); if (b) { b.focus(); b.select(); } toast('Copy the text in the box below.'); };
      try { navigator.clipboard.writeText(text).then(() => toast('Setup copied.'), fallback); } catch (err) { fallback(); }
      break;
    }
  }
});
app.addEventListener('submit', async e => {
  if (e.target.id !== 'codeform') return;
  e.preventDefault();
  const input = $('#code-in', app), v = (input && input.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!v) return;
  const q = DATA.quests.find(x => x.ch === 'hidden' && x.code && x.code === v);
  if (!q) { toast('That code does nothing. Suspicious.'); return; }
  input.value = ''; ui.code = ''; input.blur();
  if (!S.unlocked[q.id]) await put('unlocked/' + q.id, { at: Date.now(), via: 'code' });
  ui.sheet = q.id; toast('Hidden quest unlocked!'); render(true);
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'msg-in') { ui.msg = t.value; return; }
  if (t.id === 'award-note') { ui.note = t.value; return; }
  if (t.id === 'code-in') { ui.code = t.value; return; }
  if (!draft || ui.view !== 'setup') return;
  if (t.dataset.list) { setPath(draft, t.dataset.list, t.value.split('\n').map(s => s.trim()).filter(Boolean)); persistDraft(); return; }
  if (!t.dataset.path) return;
  let v = t.type === 'checkbox' ? t.checked : t.value;
  if (t.dataset.num != null) v = Math.max(0, Math.round(+t.value || 0));
  if (t.dataset.code != null) { v = String(v).toUpperCase().replace(/[^A-Z0-9]/g, ''); if (t.value !== v) t.value = v; }
  setPath(draft, t.dataset.path, v); persistDraft();
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.photo) onPhoto(t);
  else if (t.dataset.vpath) uploadVideo(t);
});

/* ---------- start ---------- */
function waitClaude() {
  return new Promise(res => {
    if (window.claude && typeof window.claude.use === 'function') return res(window.claude);
    let n = 0; const tm = setInterval(() => { if (window.claude && typeof window.claude.use === 'function') { clearInterval(tm); res(window.claude); } else if (++n > 25) { clearInterval(tm); res(null); } }, 100);
  });
}
async function boot() {
  render(true);
  const C = await waitClaude();
  if (!C) { mode = 'local'; loadLocal(); await loadPhotos(); onState(true); return; }
  cap.inViewer = true;
  const [dbNs, userNs, art, as, dl] = await Promise.all(['db', 'user', 'artifact', 'assets', 'downloads'].map(n => Promise.resolve(C.use(n)).catch(() => null)));
  cap.artifact = art; cap.assets = as; cap.downloads = dl;
  try { isOwner = userNs ? !!(await userNs.isOwner()) : false; } catch (e) { isOwner = false; }
  if (isOwner) ui.view = 'hq';
  await loadPhotos();
  if (dbNs) { db = dbNs; mode = 'live'; subscribe(); render(true); }
  else { mode = 'local'; loadLocal(); ui.liveNote = 'Playing on this phone only. The groom can’t see progress live, so text him the codes.'; onState(true); }
}
boot();
})();
</script>
