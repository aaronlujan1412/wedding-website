services:
  wedding-photo-receiver:
    build: .
    image: wedding-photo-receiver:local
    container_name: wedding-photo-receiver
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Streams straight to disk and holds no buffers, so the steady state is
    # whatever Node costs to exist. The ceiling follows the discipline the
    # secondbrain stack documents: on a host whose OOM killer has been defeated
    # by zram before, an unbounded container has no failure mode except taking
    # the machine with it.
    mem_limit: 256m
    environment:
      - ORIGINALS_UPLOAD_SECRET=${ORIGINALS_UPLOAD_SECRET:?set in .env}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:?set in .env}
      - ORIGINALS_DIR=/originals
    volumes:
      - ${ORIGINALS_DIR:?set in .env}:/originals
    # No ports published. The only way in is the Funnel sidecar below, which
    # means nothing is listening on the LAN or on cachy's interfaces.

  tailscale-wedding-photos:
    image: tailscale/tailscale:stable
    container_name: tailscale-wedding-photos
    restart: unless-stopped
    hostname: weddingphotos
    mem_limit: 256m
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      # Becomes weddingphotos.<tailnet>.ts.net, with its own name and its own
      # 443. This is the whole point of a separate node: running
      # `tailscale funnel --https 443` on cachy takes the 443 NPM serves the
      # domains on, which took the homelab down on 2026-08-20. See
      # stacks/secondbrain-rag/README.md.
      - TS_HOSTNAME=weddingphotos
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - ./state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
